<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Pemilih — Pendataan</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <script src="/js/auth.js"></script>
</head>
<body>

<header>
  <div class="container header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">🗳️</div>
      <div class="logo-text">Data<span>Pilih</span></div>
    </a>
    <nav class="nav">
      <a href="/">📊 Dashboard</a>
      <a href="/tambah-pemilih">➕ Tambah Pemilih</a>
      <a href="/import">📥 Import</a>
      <a href="/kader">🎖️ Kader</a>
      <a href="/log-duplikat">🔍 Log Duplikat</a>
    </nav>
  </div>
</header>

<div class="container-sm">
  <div class="page-header">
    <div class="breadcrumb">
      <a href="/">Dashboard</a> › <span>Edit Pemilih</span>
    </div>
    <h1>Edit Data Pemilih</h1>
    <p>Perbarui informasi data pemilih yang sudah terdaftar.</p>
  </div>

  <div id="loading-wrap" class="card" style="text-align:center;padding:50px;">
    <div class="loading"><span class="spinner"></span> Memuat data…</div>
  </div>

  <div id="form-wrap" style="display:none;">
    <div class="card">
      <div class="card-title"><div class="card-icon ci-orange">✏️</div> Form Edit Pemilih</div>

      <input type="hidden" id="edit-id"/>

      <div id="alert-success" class="alert-success"></div>
      <div id="alert-error" class="alert-error"></div>

      <div class="form-group">
        <label for="inp-nama">Nama Lengkap <span style="color:var(--danger);">*</span></label>
        <input type="text" id="inp-nama" placeholder="Nama lengkap…" autocomplete="off"/>
      </div>

      <div class="form-group">
        <label for="inp-nik">NIK (16 digit) <span style="color:var(--danger);">*</span></label>
        <input type="text" id="inp-nik" placeholder="16 digit NIK" maxlength="16" oninput="onNIKInput()" autocomplete="off" style="font-family:'JetBrains Mono',monospace;letter-spacing:1px;"/>
        <div id="nik-status" class="nik-status"></div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex:1;">
          <label for="inp-tgl-lahir">Tanggal Lahir <span class="auto-badge">AUTO</span></label>
          <input type="date" id="inp-tgl-lahir" title="Tanggal Lahir (auto-filled dari NIK)" class="auto-filled"/>
        </div>
        <div class="form-group" style="flex:1;">
          <label for="inp-jk">Jenis Kelamin <span class="auto-badge">AUTO</span></label>
          <select id="inp-jk" title="Pilih jenis kelamin" class="auto-filled">
            <option value="">— Otomatis —</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>
        <div class="form-group" style="flex:0.6;">
          <label>Umur</label>
          <div id="display-umur" class="umur-display">-</div>
        </div>
      </div>

      <div class="form-group">
        <label for="inp-kader">Kader <span style="color:var(--danger);">*</span></label>
        <select id="inp-kader" title="Pilih kader"><option value="">— Pilih Kader —</option></select>
      </div>

      <div class="gap-12" style="margin-top:8px;">
        <a href="/" class="btn btn-outline" style="flex:1;justify-content:center;">← Batal</a>
        <button class="btn btn-primary" style="flex:2;" onclick="submitEditPemilih()">💾 Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <div id="notfound-wrap" style="display:none;" class="card">
    <div class="empty"><div class="empty-icon">❌</div><p>Data tidak ditemukan. <a href="/" style="color:var(--accent);">Kembali</a></p></div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/kader.js"></script>
<script src="/js/pemilih.js"></script>
<script src="/js/form-pemilih.js"></script>
<script>
  function showToast(msg, emoji='✅') {
    const t = document.getElementById('toast');
    t.innerHTML = `${emoji} ${msg}`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  async function init() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) { showPage('notfound'); return; }

    const [data] = await Promise.all([
      PemilihAPI.getById(id),
      populateKaderSelect('inp-kader')
    ]);

    if (data.error) { showPage('notfound'); return; }

    document.getElementById('edit-id').value      = data.id;
    document.getElementById('inp-nama').value     = data.nama;
    document.getElementById('inp-nik').value      = data.nik;
    document.getElementById('inp-tgl-lahir').value = data.tanggal_lahir ? data.tanggal_lahir.substring(0,10) : '';
    document.getElementById('inp-jk').value       = data.jenis_kelamin || '';
    if (data.umur != null) document.getElementById('display-umur').textContent = data.umur + ' tahun';
    await populateKaderSelect('inp-kader', data.kader_id);

    showPage('form');
  }

  function showPage(page) {
    document.getElementById('loading-wrap').style.display  = 'none';
    document.getElementById('form-wrap').style.display     = page === 'form'     ? 'block' : 'none';
    document.getElementById('notfound-wrap').style.display = page === 'notfound' ? 'block' : 'none';
  }

  init();
</script>
</body>
</html>
